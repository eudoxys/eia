[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file=["requirements.txt"]}

[project]
name = "eia"
version = "0.0.1"
description = "EIA Form data accessor"
authors = [
    {name = "David P. Chassin", email = "dchassin@eudoxys.com"},
    ]
maintainers = [
    {name = "David P. Chassin", email = "dchassin@eudoxys.com"},
    ]
readme = "README.md"
requires-python = ">= 3.11"
keywords = ["python", "EIA", "Form", "energy", "electricity"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    ]
dynamic=["dependencies"]

[project.urls]
Homepage = "https://github.com/eudoxys/eia"
Documentation = "https://www.eudoxys.com/eia"
Repository = "https://github.com/eudoxys/eia.git"
Issues = "https://github.com/eudoxys/eia/issues"

[project.scripts]
eia = "eia.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: downloads data from EIA (deselected by default; run with `pytest -m network`)",
    ]
